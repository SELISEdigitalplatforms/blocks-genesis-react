packages:
  - "packages/*"
  - "tooling/*"
allowBuilds:
  esbuild: false
  msw: true
# pnpm catalog: pin versions once, reference them everywhere
catalog:
  typescript: ^5.9.3
  tsup: ^8.5.1
  eslint: ^9.39.5
  prettier: ^3.9.6
  # Floor matches the published peer range in packages/compose-react.
  # The @types/* packages version independently of React and have no 19.2.8.
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  tailwindcss: ^3.4.17
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^2.6.0
  date-fns: ^4.4.0
overrides:
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  fast-uri: 3.1.4
  # GHSA-mh99-v99m-4gvg is fixed only in 5.0.8; no patched 1.x exists, so the
  # whole range is pinned and patches/minimatch@3.1.5.patch adapts the lone
  # v1-style consumer to the named expand export.
  brace-expansion: 5.0.8
  esbuild: 0.28.1
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
