name: publish

on:
  push:
    branches: [inception]

# Never run two publishes at once (they'd race on the registry / git tags).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # REQUIRED for npm Trusted Publishing (OIDC) — tokenless, no 2FA needed in CI
  contents: write # push the git tags that `changeset publish` creates

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so changeset can tag correctly

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version is read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Node 22 ships an older npm,
      # so upgrade it here regardless of which tool changesets shells out to.
      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        # `pnpm release` = `turbo build && changeset publish`.
        # Auth is via OIDC Trusted Publishing (configured on npmjs.com for this
        # repo + workflow), so NO token/secret is used and 2FA is never prompted.
        # `changeset publish` only publishes versions not already on npm.
        run: pnpm release

      - name: Push release tags
        # `changeset publish` creates git tags locally; push them so the repo
        # records what was released. Guarded so a no-op release can't fail CI.
        run: git push origin --tags || true
