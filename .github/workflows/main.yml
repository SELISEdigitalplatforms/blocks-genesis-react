name: Build (main)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write
  # Granting id-token only on release-job was not enough: the job reported
  # `Contents: write, Metadata: read` with no IdToken, so npm could not mint an
  # OIDC token and never attempted Trusted Publishing at all. A called reusable
  # workflow cannot hold a permission the caller workflow never had.
  id-token: write

# One pipeline per ref. A newer push supersedes an in-flight PR run, but pushes
# to a release branch are never cancelled — that would abort a publish midway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUN_UNIT_TEST: "true"
  RUN_SECURITY: "true"
  RUN_SONARQUBE: "true"

jobs:
  # Single fan-out point: turns the env flags above into job outputs so each gate
  # can be switched off without touching its `needs` wiring.
  initialization:
    runs-on: ubuntu-latest
    outputs:
      envvalue1: ${{ steps.setvar.outputs.envvar1 }}
      envvalue2: ${{ steps.setvar.outputs.envvar2 }}
      envvalue3: ${{ steps.setvar.outputs.envvar3 }}
    steps:
      - name: Set values
        id: setvar
        run: |
          echo "envvar1=$RUN_UNIT_TEST" >> $GITHUB_OUTPUT
          echo "envvar2=$RUN_SECURITY" >> $GITHUB_OUTPUT
          echo "envvar3=$RUN_SONARQUBE" >> $GITHUB_OUTPUT

  # The three gates below all depend only on `initialization`, never on each
  # other, so they run concurrently.
  test-job:
    if: ${{ needs.initialization.outputs.envvalue1 == 'true' }}
    needs: [initialization]
    uses: ./.github/workflows/1_test.yml

  security-job:
    if: ${{ needs.initialization.outputs.envvalue2 == 'true' }}
    needs: [initialization]
    uses: ./.github/workflows/3_security.yml

  sonarqube-job:
    if: ${{ needs.initialization.outputs.envvalue3 == 'true' }}
    needs: [initialization]
    uses: ./.github/workflows/2_sonar.yml
    with:
      # The gate blocks the merge on PRs. On push it is skipped — the same commit
      # already cleared the gate as part of the PR check.
      run_quality_gate: ${{ github.event_name == 'pull_request' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_GLOBAL }}

  # Publishes only after all three gates are green, and only on a push. On a PR
  # this job shows as skipped — never make it a required status check, since a
  # skipped required check blocks merges exactly like a failing one.
  release-job:
    if: ${{ github.event_name == 'push' }}
    needs: [test-job, security-job, sonarqube-job]
    permissions:
      contents: write # push the version tag
      id-token: write # npm Trusted Publishing (OIDC)
    uses: ./.github/workflows/release.yml
